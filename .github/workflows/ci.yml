name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Validate shell scripts
        run: bash -n packaging/openvpn/build-openvpn.sh packaging/openvpn/macos/client.up packaging/openvpn/macos/client.down

      - name: Validate committed runtime assets
        run: scripts/validate-runtime-assets.sh

  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            artifact: awsvpn-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            artifact: awsvpn-aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: awsvpn-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            runner: macos-15
            artifact: awsvpn-aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate committed runtime asset
        run: scripts/validate-runtime-assets.sh ${{ matrix.target }}

      - name: Build self-contained awsvpn
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test binary
        run: target/${{ matrix.target }}/release/awsvpn --version

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/awsvpn dist/${{ matrix.artifact }}
          chmod 0755 dist/${{ matrix.artifact }}
          shasum -a 256 dist/${{ matrix.artifact }} > dist/${{ matrix.artifact }}.sha256

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256

  package-crate:
    name: Package crate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Package crate
        run: cargo package --locked
