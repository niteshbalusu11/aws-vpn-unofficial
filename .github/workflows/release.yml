name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            asset: awsvpn-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            asset: awsvpn-aarch64-unknown-linux-gnu
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            asset: awsvpn-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            runner: macos-15
            asset: awsvpn-aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate committed runtime asset
        run: scripts/validate-runtime-assets.sh ${{ matrix.target }}

      - name: Build self-contained awsvpn
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test binary
        run: target/${{ matrix.target }}/release/awsvpn --version

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          mkdir -p "dist/${asset}"
          cp "target/${{ matrix.target }}/release/awsvpn" "dist/${asset}/awsvpn"
          chmod 0755 "dist/${asset}/awsvpn"
          tar -C "dist/${asset}" -czf "dist/${asset}.tar.gz" awsvpn
          (cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256")

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Download release assets
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} dist/ \;
          ls -l dist

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          notes="Self-contained awsvpn binaries for Linux and macOS.

Download the archive for your platform, extract it, and run:

  sudo ./awsvpn connect /path/to/client-config.ovpn"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
          else
            gh release create "$TAG_NAME" dist/* \
              --title "$TAG_NAME" \
              --notes "$notes"
          fi
