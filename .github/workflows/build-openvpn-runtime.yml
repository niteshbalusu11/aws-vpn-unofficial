name: Build OpenVPN Runtime Assets

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: AWS OpenVPN source tarball URL
        required: false
        default: https://amazon-source-code-downloads.s3.amazonaws.com/aws/clientvpn/openvpn-2.6.12-aws-1.tar.gz
      source_sha256:
        description: Expected SHA-256 for the source tarball
        required: false
        default: a80ac3825bef9e97d717bc027663169903e25d86d2631e68f1100fcb2a9de702

permissions:
  contents: read

jobs:
  build-runtime:
    name: Runtime ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            curl \
            libtool \
            perl \
            pkg-config

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install autoconf automake libtool pkg-config

      - name: Build and stage runtime asset
        env:
          TARGET: ${{ matrix.target }}
          EMBED_RUNTIME: "1"
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: packaging/openvpn/build-openvpn.sh

      - name: Validate runtime asset
        run: scripts/validate-runtime-assets.sh ${{ matrix.target }}

      - name: Upload runtime asset
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: assets/openvpn-runtime/${{ matrix.target }}/openvpn
