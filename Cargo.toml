[package]
name = "aws-vpn-unofficial"
version = "0.1.0"
edition = "2024"
description = "Unofficial Rust library and CLI for AWS Client VPN SAML profiles"
readme = "README.md"
license = "GPL-2.0-only"
repository = "https://github.com/niteshbalusu11/aws-vpn-unofficial"
homepage = "https://github.com/niteshbalusu11/aws-vpn-unofficial"
keywords = ["aws", "vpn", "openvpn", "saml", "cli"]
categories = ["command-line-utilities", "network-programming"]

[lib]
name = "awsvpn"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "awsvpn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
libc = "0.2.177"
rand = "0.9.2"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.7"
webbrowser = "1.2.1"
