[package]
name = "aws-vpn-unofficial"
version = "0.1.0"
edition = "2024"

[lib]
name = "awsvpn"
path = "src/lib.rs"

[[bin]]
name = "awsvpn"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.49", features = ["derive"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
url = "2.5.7"
